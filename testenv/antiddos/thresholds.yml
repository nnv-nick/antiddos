# Пороги детектора antiddos для тестовой среды.
# Легитимный трафик: ~2 письма/с (legit-sender с RATE_PER_SEC=2).
# Все значения можно менять без пересборки образа.

connection_flood:
  # Новых соединений в секунду
  conn_rate_warn: 10.0   # ~5× нормального трафика
  conn_rate_crit: 30.0   # явный флуд
  conn_rate_low:  5.0    # гистерезис: возврат в Normal

junk_session:
  # Команд в сессиях без MAIL FROM (mail=0), в секунду
  wasted_cmd_rate_warn: 4.0
  wasted_cmd_rate_crit: 10.0
  wasted_cmd_rate_low:  2.0

slow_loris:
  # Одновременно открытых сессий (connect минус disconnect за окно 30s)
  active_sessions_warn: 20
  active_sessions_crit: 50
  active_sessions_low:  10
  # Вторичное условие: таймаутов в секунду (нужны оба условия для срабатывания)
  timeout_rate_trigger: 1.0
  timeout_rate_low:     0.5

dict_attack:
  # NOQUEUE-отказов в секунду при умеренном числе соединений
  noqueue_rate_warn: 3.0
  noqueue_rate_crit: 7.0
  noqueue_rate_low:  1.5
  # Если conn_rate выше этого — классифицируем как connection_flood, не dict_attack
  conn_rate_max: 10.0

# =============================================================
#  Actuator: параметры расчёта мер смягчения
# =============================================================
actuator:
  # α для EMA базовой линии (обновляется только в периоды без атак)
  # 0.1 = медленная адаптация (~10 снятий снимков для полного обновления)
  baseline_alpha: 0.1

  connection_flood:
    # smtpd_client_connection_rate_limit = ceil(baseline_conn_rate * 60 * multiplier)
    # Легитимный трафик ~2/s → baseline ~2/s → Warning limit = ceil(2*60*2)=240/мин
    rate_limit_multiplier_warn: 2.0
    rate_limit_multiplier_crit: 1.2
    # Нижняя граница: не обрезать трафик совсем при очень низком baseline
    rate_limit_min: 5

  slow_loris:
    # smtpd_per_record_deadline=yes включается при любом уровне атаки.
    # Легитимные клиенты отправляют команды быстро (<<10s), поэтому короткий
    # timeout безопасен. smtpd_client_connection_count_limit ограничивает
    # число слотов на один IP — при атаке с одного IP это главная защита.
    timeout_warn_sec: 30
    timeout_crit_sec: 10
    conn_count_limit_warn: 5
    conn_count_limit_crit: 3

  junk_session:
    # Снижаем smtpd_hard_error_limit — сессии с ошибками рвутся быстрее
    hard_error_limit_warn: 10
    hard_error_limit_crit: 5

  dict_attack:
    # smtpd_error_sleep_time = clamp(ceil(noqueue_rate / divisor), min, max)
    # Атакующий с 20 NOQUEUE/s получит паузу 4s → реальная скорость ~0.25 ошибки/s
    error_sleep_divisor: 5.0
    error_sleep_min_sec: 1
    error_sleep_max_sec: 10
