name: s6_multiwave
description: >
  Фаза 1: connection flood.
  Фаза 2: смена на dictionary attack.
  Фаза 3: смена на slow loris.
  Каждая фаза полностью заменяет предыдущую. Проверяем корректное
  переключение детектора и митигаций при смене вектора.

phases:
  - name: warmup
    duration: 30s
    attack:
      type: no_attack

  - name: phase1_connection_flood
    duration: 90s
    attack:
      type: connection_flood
      workers: 20
      rate_per_sec: 0

  - name: phase2_dictionary
    duration: 90s
    attack:
      type: rcpt_dictionary
      workers: 10
      rcpt_per_session: 100
      sender_domains:
        - evil1.test
        - evil2.test
        - evil3.test

  - name: phase3_slow_loris
    duration: 120s
    attack:
      type: slow_loris
      workers: 70
      slow_loris_delay_ms: 6000

  - name: recovery
    duration: 60s
    attack:
      type: no_attack
