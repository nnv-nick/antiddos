name: s5_hysteresis
description: >
  Тест гистерезиса: после critical атака снижается до зоны между low и warn.
  Корректная система должна удерживать severity=warning, а не сбрасывать в normal.
  Возврат в normal происходит только когда трафик падает ниже conn_rate_low=5.

phases:
  - name: warmup
    duration: 30s
    attack:
      type: no_attack

  - name: phase1_warning
    duration: 60s
    attack:
      type: connection_flood
      workers: 3
      rate_per_sec: 4

  - name: phase2_critical
    duration: 60s
    attack:
      type: connection_flood
      workers: 7
      rate_per_sec: 5

  - name: phase3_backoff
    duration: 60s
    attack:
      type: connection_flood
      workers: 3
      rate_per_sec: 4

  - name: phase4_hysteresis
    duration: 60s
    attack:
      type: connection_flood
      workers: 2
      rate_per_sec: 2

  - name: recovery
    duration: 60s
    attack:
      type: no_attack
