name: s1_vector_switch
description: >
  Фаза 1: junk-команды внутри сессий
  Фаза 2: переключение на флуд соединениями
  Статик-конфиг настроен на один вектор — проигрывает при смене.

phases:
  - name: warmup
    duration: 30s
    attack:
      type: no_attack

  - name: phase1_junk_session
    duration: 120s
    attack:
      type: junk_session
      workers: 40
      junk_commands_per_session: 15

  - name: transition
    duration: 10s
    attack:
      type: no_attack

  - name: phase2_connection_flood
    duration: 120s
    attack:
      type: connection_flood
      workers: 30
      rate_per_sec: 30
