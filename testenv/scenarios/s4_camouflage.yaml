name: s4_camouflage
description: >
  Фаза 1: dictionary-атака с ротацией MAIL FROM (маскируется под легит).
  Фаза 2: смена вектора на junk_session.
  Проверяем корректное переключение типа атаки детектором.

phases:
  - name: warmup
    duration: 30s
    attack:
      type: no_attack

  - name: phase1_dictionary_only
    duration: 90s
    attack:
      type: rcpt_dictionary
      workers: 8
      rcpt_per_session: 150
      sender_domains:
        - gmail.com
        - hotmail.com
        - yahoo.com
        - protonmail.com

  - name: phase2_add_junk
    duration: 120s
    attack:
      type: junk_session
      workers: 12
      junk_commands_per_session: 50
