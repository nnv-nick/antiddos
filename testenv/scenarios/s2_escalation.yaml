# S2 — "Эскалация": атака начинается тихо (ниже порогов),
# затем резко усиливается.
#
# Почему это интересно:
#   Статик-strict: режет легит с самого начала (collateral damage).
#   Статик-lenient: справляется с фазой 1, захлёбывается на фазе 2.
#   Динамика: адаптирует лимиты по мере роста нагрузки.
#
# rate_per_sec ограничен (не 0), чтобы не перегружать Docker/хост:
#   фаза 1: 5 воркеров × 3/s = 15 conn/s  (ниже порогов)
#   фаза 2: 15 воркеров × 30/s = 450 conn/s  (в ~30 раз больше)
name: s2_escalation
description: >
  Фаза 1: слабая атака (5 воркеров, rate=3/s).
  Фаза 2: внезапный рост (15 воркеров, rate=30/s).
  Проверяем, успевает ли система адаптироваться.

phases:
  - name: warmup
    duration: 30s
    attack:
      type: no_attack

  - name: phase1_low_rate
    duration: 90s
    attack:
      type: connection_flood
      workers: 5
      rate_per_sec: 3

  - name: phase2_high_rate
    duration: 120s
    attack:
      type: connection_flood
      workers: 15
      rate_per_sec: 30   # 450 conn/s суммарно — жёстко, но не убивает хост
