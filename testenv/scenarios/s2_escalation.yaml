name: s2_escalation
description: >
  Фаза 1: слабая атака
  Фаза 2: внезапный рост
  Проверяем, успевает ли система адаптироваться.

phases:
  - name: warmup
    duration: 30s
    attack:
      type: no_attack

  - name: phase1_low_rate
    duration: 90s
    attack:
      type: connection_flood
      workers: 5
      rate_per_sec: 3

  - name: phase2_high_rate
    duration: 120s
    attack:
      type: connection_flood
      workers: 15
      rate_per_sec: 30
